services:

  app:
    build: .
    container_name: pingo-decor-app
    working_dir: /var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: db_pingodecor
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
    volumes:
      - ./src:/var/www
      
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: pingo-decor-nginx
    ports:
      - "8001:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: pingo-decor-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_pingodecor
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/Pingodecor.sql:/docker-entrypoint-initdb.d/01-Pingodecor.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: pingo-decor-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
